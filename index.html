<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <meta name="description" content="Arcade. Small games, one more try. An independent development build.">
  <link rel="manifest" href="/arcade/manifest.webmanifest">
  <title>Arcade</title>
  <script type="module" crossorigin src="/arcade/assets/main-UVx4BkmI.js"></script>
  <link rel="stylesheet" crossorigin href="/arcade/assets/main-BWL1BvxP.css">
</head>
<body>
  <div id="app"></div>
  <noscript>Arcade needs JavaScript to load a game.</noscript>
</body>
</html>
