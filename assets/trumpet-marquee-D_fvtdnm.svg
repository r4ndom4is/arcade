<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="184" viewBox="0 0 1200 184" role="img" aria-labelledby="title description">
  <title id="title">trumpet flight. — pocket arcade</title>
  <desc id="description">The canonical four-square pocket arcade mark and lowercase trumpet flight. lettering share a matte grey ground with rising blue-grey suit-like curves, a narrow crimson tie seam and open negative space.</desc>
  <!--
    THESIS: Flight expressed through the fluid suit-and-tie abstraction of references
    83/84, not through a new portrait, literal instrument or decorative badge.
    OWN-WORLD: Continuous muted grey ground; blue-grey and stone curves, restrained
    crimson seam; exact canonical crimson/sand four-square mark.
    STORY: Read the game, then follow the broad rising curve into open negative space.
    FIRST VIEWPORT: Quiet mark and lettering on the left; abstract form on the right.
    FORM: Brief-pinned thin 1200:184 band. Original vector paths, no remote assets.
  -->
  <defs>
